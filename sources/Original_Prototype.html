function foc(){if(sel){const s=new Set([sel]);adj[sel].forEach(e=>{s.add(e.a);s.add(e.b)});return s}if(selE)return new Set([selE.a,selE.b]);return null}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(tx,ty);ctx.scale(k,k);const F=foc();
ctx.font='600 26px Georgia';ctx.textAlign='center';ukeys.forEach(u=>{if(hU.has(u))return;ctx.fillStyle=U[u][1]+(F?'14':'30');ctx.fillText(U[u][0].toUpperCase(),CC[u][0],CC[u][1]-(u==='mcu'?170:150))});
E.forEach(e=>{if(!evis(e))return;const p=B[e.a],q=B[e.b],hi=!F||(sel?(e.a===sel||e.b===sel):e===selE);const h=e===hovE;ctx.globalAlpha=hi?(F?.95:.38):.04;ctx.strokeStyle=ET[e.t][3];ctx.lineWidth=(h||e===selE?3:hi&&F?1.6:.7)/k;ctx.setLineDash(ET[e.t][2].map(v=>v/k));ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()});
ctx.setLineDash([]);if(F&&k>.5){ctx.font=`${13/k}px sans-serif`;E.forEach(e=>{if(!evis(e)||!(sel?(e.a===sel||e.b===sel):e===selE))return;ctx.globalAlpha=1;ctx.fillText(ET[e.t][1],(B[e.a].x+B[e.b].x)/2,(B[e.a].y+B[e.b].y)/2+4/k)})}
nodes.forEach(n=>{if(!vis(n))return;const r=rad(n),inF=!F||F.has(n.id);ctx.globalAlpha=inF?1:.08;ctx.beginPath();ctx.arc(n.x,n.y,r,0,6.283);ctx.fillStyle=col(n);ctx.shadowColor=col(n);ctx.shadowBlur=(n.id===sel?20:n.t==='p'?6:0);ctx.fill();ctx.shadowBlur=0;
if(n.up){ctx.setLineDash([3/k,2/k]);ctx.strokeStyle='#fff';ctx.lineWidth=1.2/k;ctx.beginPath();ctx.arc(n.x,n.y,r+3,0,6.283);ctx.stroke();ctx.setLineDash([])}
if(n.id===sel||n.id===hov){ctx.strokeStyle='#fff';ctx.lineWidth=1.5/k;ctx.beginPath();ctx.arc(n.x,n.y,r+4,0,6.283);ctx.stroke()}
if(inF&&(F||k>1.1||n.deg>=7||(k>.7&&n.t==='p'&&n.deg>=4))){ctx.fillStyle=inF&&F?'#fff':'#c9c9dd';ctx.font=`${(n.id===sel?13:11)/Math.min(k,1.6)*(k<1?1:1)}px Georgia`;ctx.globalAlpha=.92;ctx.fillText(n.label,n.x,n.y+r+13/Math.min(k,1.6))}});
ctx.restore();ctx.globalAlpha=1}
let busy=false;function loop(){if(alpha>.01){tick(alpha);alpha*=.985}draw();requestAnimationFrame(loop)}
function go(nx,ny,nk){const s={tx,ty,k},cx=(W>700&&$('#P').classList.contains('o'))?(W-380)/2:W/2,cy=(W<=700&&$('#P').classList.contains('o'))?H*.25:H/2,t0=performance.now(),T=nk,ttx=cx-nx*T,tty=cy-ny*T;
(function f(now){const p=Math.min(1,(now-t0)/500),e=1-Math.pow(1-p,3);tx=s.tx+(ttx-s.tx)*e;ty=s.ty+(tty-s.ty)*e;k=s.k+(T-s.k)*e;if(p<1)requestAnimationFrame(f)})(t0)}
function fit(){const v=nodes.filter(vis);if(!v.length)return;let a=1e9,b=1e9,c=-1e9,d=-1e9;v.forEach(n=>{a=Math.min(a,n.x);b=Math.min(b,n.y);c=Math.max(c,n.x);d=Math.max(d,n.y)});go((a+c)/2,(b+d)/2,Math.min((W-80)/(c-a+120),(H-140)/(d-b+120)))}
// picking
const w2=(x,y)=>[(x-tx)/k,(y-ty)/k];
function pick(x,y){const[wx,wy]=w2(x,y);let best=null,bd=1e9;nodes.forEach(n=>{if(!vis(n))return;const d=Math.hypot(n.x-wx,n.y-wy);if(d<rad(n)+5/k&&d<bd){bd=d;best=n}});if(best)return{n:best};
let be=null;bd=7/k;const F=foc();E.forEach(e=>{if(!evis(e))return;if(F&&!(sel?(e.a===sel||e.b===sel):e===selE))return;const p=B[e.a],q=B[e.b],dx=q.x-p.x,dy=q.y-p.y,l2=dx*dx+dy*dy||1;let t=Math.max(0,Math.min(1,((wx-p.x)*dx+(wy-p.y)*dy)/l2));const d=Math.hypot(wx-(p.x+t*dx),wy-(p.y+t*dy));if(d<bd){bd=d;be=e}});return be?{e:be}:null}
let drag=null;const tip=$('#tip');
cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,tx,ty,m:0};cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.m=Math.max(drag.m,Math.abs(dx)+Math.abs(dy));if(drag.m>4){tx=drag.tx+dx;ty=drag.ty+dy}return}
const h=pick(e.clientX,e.clientY);hov=h&&h.n?h.n.id:null;hovE=h&&h.e||null;cv.style.cursor=h?'pointer':'grab';
if(h){tip.style.display='block';tip.style.left=Math.min(e.clientX+14,W-250)+'px';tip.style.top=e.clientY+14+'px';tip.innerHTML=h.n?`<b>${h.n.label}</b><br>${T[h.n.t]}${h.n.u!=='x'?' · '+U[h.n.u][0]:''}`:`<b>${ET[h.e.t][1]} ${ET[h.e.t][0]}</b><br>${B[h.e.a].label} → ${B[h.e.b].label}<br><small>Click for details</small>`}else tip.style.display='none'};
cv.onpointerup=e=>{if(drag&&drag.m<5){const h=pick(e.clientX,e.clientY);if(h&&h.n)select(h.n.id);else if(h&&h.e)selEdge(h.e)}drag=null};
cv.onwheel=e=>{e.preventDefault();const f=Math.exp(-e.deltaY*.0015),nk=Math.max(.15,Math.min(5,k*f)),r=nk/k;tx=e.clientX-(e.clientX-tx)*r;ty=e.clientY-(e.clientY-ty)*r;k=nk};
// panel
const P=$('#P'),pv=e=>{const[l,c]=PV[e.pv];return`<span class="pill" style="color:${c};border-color:${c}">${l}</span>`};
const ok=e=>e.sp<=L||rev.has(e.i);
function close(){P.classList.remove('o')}
function select(id,noGo){const n=B[id];sel=id;selE=null;const g=adj[id];
const grp={};g.forEach(e=>(grp[e.t]=grp[e.t]||[]).push(e));
const u=U[n.u];let h=`<button class="x" onclick="resetMap()">✕</button><span class="pill" style="color:${col(n)};border-color:${col(n)}">${T[n.t]}</span>${n.u!=='x'?`<span class="pill" style="color:${u[1]};border-color:${u[1]}">${u[0]}</span>`:''}${n.up?'<span class="pill" style="color:#fff;border-color:#fff">UPCOMING</span>':''}<h2>${n.label}</h2><p style="color:#889">${n.yr?(n.up?'Announced for ':'Released ')+n.yr:''}</p><p>${n.d||'Part of the web; follow the connections below.'}</p>`;
if(n.up)h+='<p style="color:#fc6">Officially announced only. Rumors are labelled separately.</p>';
if(n.t==='p'){const pre=g.filter(e=>e.t==='cont'&&e.b===id),nx=g.filter(e=>e.t==='cont'&&e.a===id);
if(pre.length)h+=`<h3>Watch before / pays off</h3>`+pre.map(e=>`<div class="it"><a data-n="${e.a}">${B[e.a].label}</a>${ok(e)?`<span>${e.ti}</span>`:'<span>🔒 spoiler</span>'}</div>`).join('');
if(nx.length)h+=`<h3>Sets up</h3>`+nx.map(e=>`<div class="it"><a data-n="${e.b}">${B[e.b].label}</a>${ok(e)?`<span>${e.ti}</span>`:'<span>🔒 spoiler</span>'}</div>`).join('')}
Object.keys(grp).forEach(t=>{h+=`<h3>${ET[t][1]} ${ET[t][0]} (${grp[t].length})</h3>`+grp[t].map(e=>{const o=e.a===id?e.b:e.a;return`<div class="it"><a data-n="${o}">${B[o].label}</a><span>${ok(e)?e.ti:'🔒 spoiler L'+e.sp}</span><i data-e="${e.i}" title="Open connection">ⓘ</i></div>`}).join('')});
P.innerHTML=h;P.classList.add('o');P.scrollTop=0;if(!noGo)go(n.x,n.y,Math.max(k,1.5))}
function selEdge(e,noGo){selE=e;sel=null;const a=B[e.a],b=B[e.b],t=ET[e.t],open=ok(e);
P.innerHTML=`<button class="x" onclick="resetMap()">✕</button><span class="pill" style="color:${t[3]};border-color:${t[3]}">${t[1]} ${t[0]}</span>${pv(e)}<h2><a style="color:#9cf;cursor:pointer" data-n="${a.id}">${a.label}</a> → <a style="color:#9cf;cursor:pointer" data-n="${b.id}">${b.label}</a></h2>`+(open?`<h3>${e.ti}</h3><p>${e.tx}</p><p style="color:#889">Spoiler level ${e.sp}. ${e.pv==='c'?'Officially established.':e.pv==='t'?'Real-world production trivia, not in-universe canon.':e.pv==='f'?'Fan interpretation, not official.':e.pv==='r'?'Reported by media, not officially confirmed.':e.pv==='d'?'Genuinely disputed.':'Community observation.'}</p>`:`<div class="gate" data-r="${e.i}">⚠ Spoiler level ${e.sp}. Click to reveal this connection.</div>`);
P.classList.add('o');if(!noGo)go((a.x+b.x)/2,(a.y+b.y)/2,Math.min(k<1.2?1.2:k,2))}
P.onclick=ev=>{const t=ev.target;if(t.dataset.n)select(t.dataset.n);else if(t.dataset.e)selEdge(E[t.dataset.e],true);else if(t.dataset.r){rev.add(E[t.dataset.r]);rev.add(+t.dataset.r);selEdge(E[t.dataset.r],true)}};
function resetMap(){sel=selE=null;close();fit();q.value='';res.style.display='none'}
$('#reset').onclick=resetMap;$('#sp').onchange=e=>{L=+e.target.value;sel?select(sel,true):selE&&selEdge(selE,true)};
// search
const q=$('#q'),res=$('#res');let rs=[],ri=0;
function score(n,s){const l=(n.label+' '+n.id).toLowerCase();if(l.startsWith(s))return 0;if(l.split(/[\s:\-&]+/).some(w=>w.startsWith(s)))return 1;if(l.includes(s))return 2;let i=0;for(const c of l){if(c===s[i])i++}return i===s.length?3:9}
q.oninput=()=>{const s=q.value.trim().toLowerCase();if(!s){res.style.display='none';return}rs=nodes.map(n=>[score(n,s)+(n.t==='p'?0:.1)-n.deg*.01,n]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]).slice(0,9).map(x=>x[1]);ri=0;res.innerHTML=rs.map((n,i)=>`<div data-i="${i}" class="${i?'':'on'}">${n.label}<small>${T[n.t]}${n.yr?' · '+n.yr:''}</small></div>`).join('')||'<div>No match. Try a shorter word.</div>';res.style.display='block'};
res.onclick=e=>{const d=e.target.closest('[data-i]');if(d)pickR(+d.dataset.i)};
function pickR(i){const n=rs[i];if(!n)return;res.style.display='none';q.value=n.label;hT.clear();hU.clear();buildF();select(n.id)}
q.onkeydown=e=>{if(e.key==='Enter')pickR(ri);else if(e.key==='ArrowDown'||e.key==='ArrowUp'){ri=(ri+(e.key==='ArrowDown'?1:rs.length-1))%Math.max(1,rs.length);[...res.children].forEach((c,i)=>c.classList.toggle('on',i===ri));e.preventDefault()}else if(e.key==='Escape')res.style.display='none'};
// filters
function buildF(){const f=$('#flt');f.innerHTML=Object.keys(T).map(t=>`<button data-t="${t}" class="${hT.has(t)?'off':''}" style="border-color:${TC[t]||'#e23636'}">${T[t]}</button>`).join('')+ukeys.map(u=>`<button data-u="${u}" class="${hU.has(u)?'off':''}" style="border-color:${U[u][1]}">${U[u][0]}</button>`).join('')}
$('#flt').onclick=e=>{const b=e.target.closest('button');if(!b)return;const s=b.dataset.t?hT:hU,k2=b.dataset.t||b.dataset.u;s.has(k2)?s.delete(k2):s.add(k2);buildF()};
addEventListener('resize',()=>{size()});size();buildF();fit();loop();
</script></body></html>
